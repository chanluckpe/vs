<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap">
<style>
/* 레이아웃: 머리띠(로고·교사 모드·사용법) → 절차 카드(준비→경기→기록→보관함) → 화면 폭을 다 쓰는 데이터 영역.
   색: 코발트·코랄 그라데이션 / 글꼴·모양: 처음 버전(Black Han Sans · IBM Plex Sans KR · Oswald, 둥근 모서리, 왼쪽 정렬) */
:root {
  --bg: #f7f4ee;
  --surface: #ffffff;
  --surface-2: #f3efe7;
  --ink: #14182b;
  --muted: #545a6e;
  --line: #e1dbd0;
  --line-strong: #c4bdb0;
  --cobalt: #1f3fbf;
  --cobalt-deep: #142a80;
  --cobalt-soft: #e3e8fa;
  --coral: #ff6b4a;
  --coral-ink: #c2401f;
  --coral-soft: #ffe0d7;
  --side-a: #1f3fbf;
  --side-a-soft: #e3e8fa;
  --side-b: #c2401f;
  --side-b-soft: #ffe0d7;
  --grad-cobalt: linear-gradient(135deg, #3457dd 0%, #1f3fbf 45%, #142a80 100%);
  --grad-coral: linear-gradient(135deg, #ff9a7d 0%, #ff6b4a 55%, #f2512f 100%);
  --grad-dawn: linear-gradient(120deg, #142a80 0%, #1f3fbf 55%, #7a4bc0 82%, #ff6b4a 100%);
  --grad-soft: linear-gradient(135deg, #ffffff 0%, #fbf8f3 60%, #fff0eb 100%);
  --grad-court-b: linear-gradient(135deg, #d9542f 0%, #c2401f 50%, #8f2a12 100%);
  --shadow: 0 1px 2px rgba(20, 24, 43, .06), 0 4px 14px rgba(20, 42, 128, .08);
  --f-display: "Black Han Sans", "Noto Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-ui: var(--f-body);
  --f-num: "Oswald", "IBM Plex Sans KR", system-ui, sans-serif;
  --r: 12px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--cobalt-deep); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.center { text-align: center; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: 1680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 머리띠 */
.topbar { background: var(--grad-dawn); color: #fff; }
.topbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 40px; height: 40px; border-radius: 11px; background: rgba(255,255,255,.18); box-shadow: 0 0 0 2px rgba(255,255,255,.5); object-fit: cover; flex: none; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 22px; letter-spacing: .5px; line-height: 1.1; white-space: nowrap; }
.brand .sub { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.topbar .btn { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.5); color: #fff; }
.topbar .btn:hover { background: rgba(255,255,255,.22); }
.topbar .btn[aria-pressed="true"] { background: #fff; color: var(--cobalt-deep); border-color: #fff; }

/* 절차 카드 */
.steps-wrap { border-bottom: 1px solid var(--line); background: var(--surface); }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding-block: 10px; }
.stepcard { position: relative; display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--grad-soft); border-radius: var(--r); padding: 6px 14px 6px 8px; min-height: 76px; text-align: left; transition: transform .15s ease, box-shadow .15s ease; }
.stepcard:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.stepcard img { height: 68px; width: 76px; object-fit: contain; flex: none; }
.stepcard .st-txt { display: flex; flex-direction: column; min-width: 0; }
.stepcard .st-no { font-family: var(--f-num); font-size: 12px; letter-spacing: .6px; color: var(--coral-ink); }
.stepcard .st-t { font-family: var(--f-display); font-size: 21px; line-height: 1.15; letter-spacing: .3px; }
.stepcard .st-d { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.stepcard .badge { position: absolute; top: 8px; right: 10px; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--ink); color: #fff; }
.stepcard .badge.hot { background: var(--coral); color: var(--ink); }
.stepcard[aria-selected="true"] { background: var(--grad-cobalt); border-color: var(--cobalt-deep); color: #fff; box-shadow: 0 8px 22px -10px rgba(31, 63, 191, .75); }
.stepcard[aria-selected="true"] .st-no { color: #ffc3b3; }
.stepcard[aria-selected="true"] .st-d { color: rgba(255,255,255,.82); }
.stepcard[aria-selected="true"] img { filter: drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 0 6px rgba(255,255,255,.35)); }
.stepcard::after { content: ""; position: absolute; right: -10px; top: 50%; width: 8px; height: 8px; border-top: 2px solid var(--line-strong); border-right: 2px solid var(--line-strong); transform: translateY(-50%) rotate(45deg); z-index: 2; }
.stepcard:last-child::after { display: none; }
@media (max-width: 699px) { .stepcard .st-d { display: none; } }
@media (max-width: 640px) {
  .steps { gap: 6px; padding-block: 8px; }
  .stepcard { flex-direction: column; gap: 0; padding: 6px 2px; min-height: 0; text-align: center; }
  .stepcard .st-txt { align-items: center; }
  .stepcard img { height: 46px; width: 56px; }
  .stepcard .st-t { font-size: 16px; }
  .stepcard .st-no { display: none; }
  .stepcard::after { display: none; }
  .stepcard .badge { top: 3px; right: 3px; }
  .brand .sub { white-space: normal; }
}

main.wrap { padding-block: 16px 48px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.c { justify-content: flex-start; }
.grid-2 { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 16px; align-items: start; }
/* 휴대폰 세로(560px 이하)만 1단, 그 외(태블릿·웹·좁은 창)는 모두 2단 */
@media (max-width: 900px) { .grid-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .panel { padding: 14px; } }
@media (max-width: 560px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.panel-h h2 { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel-h .tools, .panel-h .row { display: flex; gap: 8px; flex-wrap: wrap; }
.step { font-family: var(--f-num); font-size: 13px; width: 24px; height: 24px; border-radius: 7px; display: inline-grid; place-items: center; background: var(--grad-cobalt); color: #fff; flex: none; }
.label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .3px; }
.kicker { font-size: 12px; font-weight: 700; color: var(--coral-ink); letter-spacing: .5px; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); padding: 8px 14px; font-weight: 700; font-size: 14px; white-space: nowrap; min-height: 40px; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--grad-cobalt); border-color: var(--cobalt-deep); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ink { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.go { background: var(--grad-coral); border-color: #ea5a3a; color: var(--ink); }
.btn.go:hover { filter: brightness(1.05); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.lg { min-height: 52px; padding: 12px 22px; font-size: 16px; border-radius: 12px; }
.btn.danger { color: var(--coral-ink); border-color: var(--coral-ink); background: transparent; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; font-weight: 800; flex: none; }

/* 입력 */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.input, textarea.input { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 8px 10px; min-height: 40px; width: 100%; }
textarea.input { resize: vertical; min-height: 64px; line-height: 1.5; }
.info-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) repeat(3, minmax(0, 1fr)); gap: 10px; }
.date-row { display: flex; gap: 6px; }
.date-row .input { flex: 1; min-width: 0; }
@media (max-width: 760px) { .info-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .info-grid > :first-child { grid-column: 1 / -1; } }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 7px 14px; font-weight: 700; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--grad-cobalt); color: #fff; border-color: var(--cobalt-deep); }
.choice { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.choice b { font-size: 15px; }
.choice span { font-size: 12.5px; color: var(--muted); }
.choice[aria-pressed="true"] { border-color: var(--cobalt); background: linear-gradient(135deg, #eef1ff, #e3e8fa 60%, #fff0eb); }
.choice-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .choice-grid { grid-template-columns: minmax(0, 1fr); } }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
.stepper button { width: 40px; height: 40px; border: 0; background: var(--surface-2); font-weight: 800; font-size: 18px; }
.stepper span { min-width: 44px; text-align: center; font-size: 18px; }

/* 학생 명단 */
.roster { display: flex; flex-wrap: wrap; gap: 6px; max-height: 240px; overflow: auto; padding: 2px; }
.stu { display: inline-flex; align-items: center; border-radius: 99px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
.stu.M { background: linear-gradient(90deg, var(--cobalt-soft), #fff 75%); }
.stu.F { background: linear-gradient(90deg, var(--coral-soft), #fff 75%); }
.stu .g { border: 0; border-radius: 99px 0 0 99px; padding: 5px 8px 5px 10px; font-size: 12px; font-weight: 800; background: transparent; }
.stu.M .g { color: var(--cobalt); }
.stu.F .g { color: var(--coral-ink); }
.stu .n { padding: 5px 2px; }
.stu .x { border: 0; background: transparent; padding: 5px 10px 5px 6px; color: var(--muted); border-radius: 0 99px 99px 0; }
.stu .x:hover { color: var(--coral-ink); }
.note { display: flex; gap: 10px; align-items: center; background: linear-gradient(90deg, var(--coral-soft), #fff4f0); color: var(--coral-ink); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
.note.info { background: linear-gradient(90deg, var(--cobalt-soft), #f4f6ff); color: var(--cobalt-deep); }

.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.team { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--grad-soft); min-width: 0; }
.team-h { font-weight: 800; font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; }
.team-h small { color: var(--muted); font-weight: 500; font-size: 12px; }
.team .mem { display: flex; flex-wrap: wrap; gap: 4px; }
.mem button { border: 1px solid var(--line); border-radius: 7px; background: var(--surface); padding: 3px 8px; font-size: 13px; font-weight: 600; }
.mem button.sel { border-color: var(--coral); background: var(--coral-soft); }
.mem button.M { box-shadow: inset 3px 0 0 var(--cobalt); }
.mem button.F { box-shadow: inset 3px 0 0 var(--coral); }
.star { color: var(--coral-ink); font-weight: 900; }

.start-bar { position: sticky; bottom: 0; z-index: 5; background: linear-gradient(to top, var(--bg) 70%, transparent); padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); }
.start-inner { display: flex; gap: 12px; align-items: center; background: var(--grad-dawn); color: #fff; border-radius: 14px; padding: 12px 12px 12px 18px; box-shadow: 0 12px 28px -14px rgba(20, 42, 128, .8); flex-wrap: nowrap; }
.start-inner .sum { flex: 1 1 auto; min-width: 0; }
.start-inner .sum b, .start-inner .sum div { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.start-inner > .btn { flex: none; margin-left: auto; }
@media (max-width: 560px) { .start-bar { padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); } .start-inner { padding: 8px 8px 8px 14px; gap: 8px; } .start-inner .sum b { font-size: 14px; } .start-inner .sum div { font-size: 12px; } .start-inner > .btn { padding: 10px 14px; font-size: 14px; } }
.start-inner .sum b { font-size: 16px; }
.start-inner .sum div { font-size: 13px; opacity: .85; }

/* 경기 화면 */
.comp-head { display: flex; gap: 14px 24px; align-items: center; flex-wrap: wrap; }
.comp-head > div:first-child { flex: 1 1 320px; min-width: 0; }
.comp-head > div:last-child { flex: 1 1 260px; max-width: 460px; }
.comp-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; letter-spacing: .3px; }
.comp-head .meta { font-size: 13px; color: var(--muted); }
.bar { height: 9px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cobalt), #7a4bc0, var(--coral)); border-radius: 99px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 800; white-space: nowrap; border: 0; }
.pill.live { background: var(--grad-coral); color: var(--ink); }
.pill.done { background: var(--cobalt-soft); color: var(--cobalt-deep); }
.pill.wait { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.warn { background: var(--coral-soft); color: var(--coral-ink); }
.pill.bonus { background: var(--coral); color: var(--ink); }
button.pill { cursor: pointer; }

.sec-t { font-size: 17px; font-weight: 800; margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.courts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.court { border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
.court-h { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--grad-cobalt); color: #fff; }
.court-h b { font-family: var(--f-display); font-weight: 400; font-size: 19px; letter-spacing: .5px; }
.court-h span { font-size: 12px; opacity: .85; }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 16px 14px 10px; }
.side { min-width: 0; }
.side.b { text-align: right; }
.side .nm { font-weight: 800; font-size: 17px; line-height: 1.25; }
.side .mb { font-size: 12.5px; color: var(--muted); }
.side.a .nm { color: var(--side-a); }
.side.b .nm { color: var(--side-b); }
.vs .mid { font-family: var(--f-num); font-size: 28px; font-weight: 600; text-align: center; color: var(--line-strong); }
.vs .mid.scored { color: var(--ink); }
.court-f { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 14px 14px; flex-wrap: wrap; }
.ref { font-size: 13px; color: var(--muted); }
.ref b { color: var(--ink); }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--grad-cobalt); color: #fff; box-shadow: var(--shadow); }

.mlist { display: flex; flex-direction: column; gap: 6px; }
.round-h { font-size: 12px; font-weight: 800; color: var(--coral-ink); letter-spacing: .4px; margin: 10px 0 2px; }
.mrow { display: grid; grid-template-columns: 110px minmax(0, 1fr) 76px minmax(0, 1fr) 96px; gap: 10px; align-items: center; padding: 9px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-align: left; width: 100%; }
.mrow:hover { border-color: var(--line-strong); }
.mrow .no { font-size: 12px; color: var(--muted); font-weight: 700; }
.mrow .t { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .t.r { text-align: right; }
.mrow .t.w { color: var(--cobalt); }
.mrow .t.l { color: var(--muted); font-weight: 500; }
.mrow .sc { text-align: center; font-family: var(--f-num); font-size: 18px; }
.mrow .st { justify-self: end; }
.mlist.plain .mrow { grid-template-columns: minmax(0, 1fr) 76px minmax(0, 1fr) 96px; }
.mlist.plain .mrow .no { display: none; }
@media (max-width: 560px) {
  .mrow, .mlist.plain .mrow { grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr); row-gap: 4px; }
  .mrow .no { grid-column: 1 / -1; }
  .mrow .st { grid-column: 1 / -1; justify-self: start; }
}

table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: center; font-size: 12px; color: var(--muted); font-weight: 700; padding: 8px 6px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.tbl td { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td.l, .tbl th.l { text-align: left; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover td { background: #fff4f0; }
.tbl .pts { font-family: var(--f-num); font-size: 17px; font-weight: 600; }
.tbl .rank { font-family: var(--f-num); font-size: 16px; color: var(--muted); }
.tbl tr.top1 .rank { color: var(--coral-ink); }
.scroll-x { overflow-x: auto; }

/* 아래→위 토너먼트 표 */
.tree-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; }
.tree-wrap { background: linear-gradient(180deg, #fff6f2 0%, #fbf9f5 40%, #f4f1ea 100%); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.tree { display: block; margin: 0 auto; height: auto; }
.tree .lk { fill: none; stroke: #cfc8bb; stroke-width: 2; }
.tree .lk.win { stroke-width: 4; }
.tree .lk.new { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.1s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.tree .nd { cursor: pointer; }
.tree .nd rect.bg { fill: #fff; stroke: #d6cfc2; stroke-width: 1.2; }
.tree .nd.live rect.bg { stroke: var(--coral); stroke-width: 2.5; }
.tree .nd.done rect.bg { stroke: var(--cobalt); }
.tree .nd:hover rect.bg { stroke: var(--cobalt); stroke-width: 2.2; }
.tree .nm { font-family: var(--f-body); font-size: 13px; font-weight: 700; fill: var(--ink); }
.tree .nm.tbd { fill: #a39e93; font-weight: 500; }
.tree .nm.lose { fill: #8d909c; font-weight: 500; }
.tree .nm.win { fill: #fff; }
.tree .sc { font-family: var(--f-num); font-size: 14px; font-weight: 600; fill: var(--ink); }
.tree .sc.win { fill: #fff; }
.tree .sc.lose { fill: #8d909c; }
.tree .rl { font-family: var(--f-body); font-size: 12.5px; font-weight: 800; fill: var(--coral-ink); }
.tree .tag { font-family: var(--f-body); font-size: 10.5px; font-weight: 700; }
.tree .champ-n { font-family: var(--f-display); font-size: 22px; fill: var(--ink); }
.tree .champ-k { font-family: var(--f-num); font-size: 12px; fill: var(--coral-ink); letter-spacing: 1.5px; }
.tree-legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.tree-legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.tree-title { font-weight: 800; font-size: 15px; margin: 2px 4px 6px; }
.tree-title small { font-weight: 500; font-size: 12.5px; color: var(--muted); margin-left: 6px; }

.champ { display: flex; align-items: center; gap: 18px; padding: 14px 20px; border-radius: 14px; background: var(--grad-coral); color: var(--ink); flex-wrap: wrap; box-shadow: 0 12px 28px -16px rgba(242, 81, 47, .9); }
.champ .k { font-family: var(--f-num); font-size: 13px; letter-spacing: 1px; }
.champ .n { font-family: var(--f-display); font-size: 30px; line-height: 1.15; }

.empty { display: flex; gap: 8px; align-items: flex-start; padding: 24px; flex-direction: column; }
.empty h3 { font-size: 20px; }

/* 모달 */
.modal-back { position: fixed; inset: 0; background: rgba(20, 24, 43, .55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: env(safe-area-inset-top, 0px) 0 0; }
@media (min-width: 700px) { .modal-back { align-items: center; padding: 24px; } }
.modal { background: var(--surface); width: 100%; max-width: 640px; max-height: 92vh; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
@media (min-width: 700px) { .modal { border-radius: 18px; } }
.modal.wide { max-width: 920px; }
.modal-h { padding: 14px 18px 12px; background: var(--grad-cobalt); color: #fff; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.modal-h h3 { font-size: 18px; font-weight: 800; }
.modal-h .muted { color: rgba(255,255,255,.82); }
.modal-h .icon-btn { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.5); color: #fff; }
.modal-b { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-f { padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.modal-f .grow { flex: 1; }

/* 점수판 */
.sb { position: fixed; inset: 0; z-index: 60; background: #0f1430; color: #fff; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.sb-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; flex-wrap: wrap; }
.sb-top .t { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; opacity: .85; }
.sb-top .r { display: flex; gap: 8px; }
.sb .btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.3); color: #fff; }
.sb-subs { display: flex; gap: 6px; padding: 0 14px 8px; flex-wrap: wrap; }
.sb-subs button { border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff; border-radius: 99px; padding: 5px 12px; font-weight: 700; font-size: 13px; }
.sb-subs button[aria-pressed="true"] { background: var(--coral); color: var(--ink); border-color: var(--coral); }
.sb-sides { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 6px; min-height: 0; }
@media (max-width: 520px) and (orientation: portrait) { .sb-sides { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
.sb-side { border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; min-height: 0; padding: 12px; }
.sb-side.A { background: var(--grad-cobalt); }
.sb-side.B { background: var(--grad-court-b); }
.sb-name { font-weight: 800; font-size: clamp(18px, 3.2vw, 30px); text-align: center; line-height: 1.2; }
.sb-mem { font-size: clamp(12px, 1.6vw, 16px); opacity: .8; text-align: center; }
.sb-plus { border: 0; background: transparent; color: #fff; font-family: var(--f-num); font-weight: 600; font-size: clamp(90px, 22vw, 260px); line-height: 1; padding: 0 20px; width: 100%; flex: 1; display: grid; place-items: center; min-height: 0; -webkit-tap-highlight-color: transparent; }
.sb-plus:active { transform: scale(.97); }
.sb-minus { border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.15); color: #fff; border-radius: 10px; padding: 6px 18px; font-weight: 800; }
.sb-hint { position: absolute; top: 10px; right: 12px; font-size: 12px; opacity: .6; }
.sb-bottom { display: flex; gap: 10px; align-items: center; padding: 10px 14px 12px; flex-wrap: wrap; }
.sb-bottom .msg { flex: 1; min-width: 180px; font-size: 14px; font-weight: 600; opacity: .9; }
.sb-bottom .btn.go:disabled { background: rgba(255,255,255,.15); border-color: transparent; color: rgba(255,255,255,.6); opacity: 1; }
.sb-direct { display: flex; gap: 6px; align-items: center; }
.sb-direct input { width: 64px; text-align: center; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 8px; padding: 6px; font-family: var(--f-num); font-size: 18px; }

/* 평가 */
.ev-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--grad-soft); }
.ev-card.ok { border-color: var(--cobalt); }
.ev-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.ev-top b { font-size: 16px; }
.ev-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; align-items: center; }
.ev-row .c { font-weight: 700; font-size: 14px; }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.scale button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; height: 38px; font-family: var(--f-num); font-size: 17px; }
.scale button[aria-pressed="true"] { background: var(--grad-cobalt); color: #fff; border-color: var(--cobalt-deep); }
.side-tag { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 6px; }
.side-tag.a { background: var(--side-a-soft); color: var(--side-a); }
.side-tag.b { background: var(--side-b-soft); color: var(--side-b); }
details.more summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); }
details.more[open] summary { margin-bottom: 6px; }
.crit-help { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.crit-help b { color: var(--ink); }

/* 프로필 */
.prof { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 640px) { .prof { grid-template-columns: minmax(0, 1fr); } }
.radar text { fill: var(--ink); font-family: var(--f-body); }
.radar .val { fill: var(--coral-ink); }
.note-box { border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.note-box.s { background: linear-gradient(135deg, var(--cobalt-soft), #f4f6ff); }
.note-box.i { background: linear-gradient(135deg, var(--coral-soft), #fff4f0); }
.note-box h4 { margin: 0 0 4px; font-size: 13px; }
.motto { text-align: center; font-weight: 800; padding: 10px; border-radius: 10px; background: var(--grad-dawn); color: #fff; }
.motto .muted { color: rgba(255,255,255,.85); }

.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.arc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--grad-soft); }
.arc .t { font-weight: 800; }
.arc .d { font-size: 13px; color: var(--muted); }
.arc-grid { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 640px) { .arc { grid-template-columns: minmax(0, 1fr); } }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 99px; font-weight: 700; font-size: 14px; z-index: 80; box-shadow: var(--shadow); max-width: min(520px, calc(100% - 32px)); text-align: center; }
.teacher-bar { background: var(--grad-coral); color: var(--ink); font-size: 13px; font-weight: 700; }
.teacher-bar .wrap { display: flex; gap: 10px; align-items: center; padding-block: 6px; flex-wrap: wrap; }
.teacher-bar .btn { background: rgba(255,255,255,.55); border-color: rgba(20,24,43,.35); }
.copy-area { width: 100%; min-height: 180px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

/* 사용법 */

function stageLabel(c, m) {
  if (c.format === 'league') return `${m.r + 1}라운드`;
  if (isDual(c) && !c._g && m.grp) return stageLabel(gview(c, m.grp), m);
  const W = c.matches.filter(x => x.stage === 'W'); const K = Math.max(...W.map(x => x.r)) + 1;
  if (m.stage === 'W') {
    if (c.format === 'single') { const left = K - 1 - m.r; return left === 0 ? '결승' : left === 1 ? '준결승' : left === 2 ? '8강' : left === 3 ? '16강' : `${m.r + 1}회전`; }
    return m.r === K - 1 ? '승자조 결승' : `승자조 ${m.r + 1}회전`;
  }
  if (m.stage === 'L') { const L = Math.max(...c.matches.filter(x => x.stage === 'L').map(x => x.r)); return m.r === L ? '패자조 결승' : `패자조 ${m.r + 1}회전`; }

function syncBadge(c) { const y = c.sync; if (!y || !y.code) return ''; const ct = (y.courts || []).slice().sort((a, b) => a - b); return `<span class="pill sy-pill">기기 연결 · 코드 ${esc(y.code)}${ct.length ? ` · 경기장 ${ct.join(',')}번` : ''}</span>`; }
function gradeLabel(g) { return g ? (/^\d+$/.test(g) ? g + '학년' : g) : ''; }
function clsLabel(k) { return k ? (/^\d+$/.test(k) ? k + '반' : k) : ''; }

function classLabel(info) {

async function rubricPDF() {
  if (expBusy) return; expBusy = true; toast('평가 준거 PDF를 만드는 중이에요…');
  try {
    await loadLib('h2i'); try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) { }
    const keys = (ui.rd && ui.rd.crit && ui.rd.crit.length) ? ui.rd.crit : CRIT_ALL.map(x => x.k);
    // 한 장에 다 들어가도록: 열 수(2~4)·가로/세로를 바꿔 보며 글자가 가장 크게 나오는 배치를 고름
    const mk = (W, cols) => { const w = document.createElement('div'); w.className = 'cap-wrap'; w.style.width = W + 'px';
      w.innerHTML = `<div class="cap-h"><img src="${FACE_IMG}" alt=""><div><b>급식대장의 대진표 · 태도 평가 준거</b><span>${keys.length}개 항목 · 5점(아주 잘해요) ~ 1점(많은 노력이 필요해요) · 경기 중 보이는 행동으로 평가해요</span></div></div><div class="cap-body rub-print">${rubricBody(keys)}</div>`;
      const g = w.querySelector('.rub-cards'); if (g) g.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
      document.body.appendChild(w); return w; };
    const opts = [[1000, 2], [1400, 3], [1800, 4]].filter(o => o[1] <= Math.max(2, keys.length));
    let best = null;
    for (const [W, cols] of opts) { const w = mk(W, cols); const h = w.scrollHeight; w.remove();
      for (const land of [false, true]) { const [pw, ph] = land ? A4.land : A4.port; const k = Math.min((pw - A4.m * 2) / W, (ph - A4.m * 2) / h); if (!best || k > best.k) best = { k, W, cols, land }; } }
    const w = mk(best.W, best.cols); let pages;
    try { const cv = await shot(w, best.W); pages = [fitPage(cv, best.land)]; } finally { w.remove(); }
    await offerFile('태도평가_준거표.pdf', await makePDF(pages));
  } catch (e) { toast('준거표를 만들지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요'); }
  finally { expBusy = false; }
}

function openModal(m) { ui.modal = m; renderModal(); }
function closeModal() { ui.modal = null; renderModal(); }
function renderModal() {
  const root = $('#modalRoot'); const m = ui.modal;
  if (!m) { root.innerHTML = ''; return; }
  const html = MODAL[m.type](m);
  // 같은 창을 다시 그릴 때는 스크롤 위치를 그대로 (태도 평가 입력 중 맨 위로 튀지 않게)
  const same = renderModal.last === m; const keep = same ? [...root.querySelectorAll('.modal-back, .modal, .modal-b, .ev-list, [data-keep-scroll]')].map(el => el.scrollTop) : null;
  root.innerHTML = `<div class="modal-back" data-act="modalBack"><div class="modal ${m.wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  if (keep) [...root.querySelectorAll('.modal-back, .modal, .modal-b, .ev-list, [data-keep-scroll]')].forEach((el, i) => { if (keep[i]) el.scrollTop = keep[i]; });
  renderModal.last = m;
}

    ${pick === 'host' ? `<div class="sy-box">${m === 'host' ? `<div>수업 코드</div><div class="sy-big num">${SY.code}</div><p class="muted small">경기장 기기에서 [기기 연결 → 경기장 기기]를 누르고 이 코드와 경기장 번호를 넣으면 돼요. 이 기기의 대진표·명단·설정이 그대로 공유돼요.</p><div class="row"><button class="btn" data-act="syncNewCode">새 코드 만들기</button><button class="btn ghost" data-act="syncLeave">연결 끊고 이 기기에만 저장</button></div>` : `<p class="muted small" style="margin:0 0 8px">이 기기를 진행 기기로 쓰면 4자리 수업 코드가 생겨요. 지금 준비·경기 내용은 그대로 이어져요.</p><button class="btn go lg" data-act="syncHost" ${avail ? '' : 'disabled'}>진행 기기로 시작</button>`}</div>` : ''}
    ${pick === 'court' ? `<div class="sy-box">${m === 'court' ? `<div>지금 <b>경기장 ${SY.court}번</b> · 수업 코드 <b class="num">${SY.code}</b></div><div class="row" style="margin-top:8px"><span class="label">경기장 바꾸기</span>${[1, 2, 3, 4, 5, 6, 7, 8].map(n => `<button class="chip" data-act="syncCourt" data-v="${n}" aria-pressed="${SY.court === n}">${n}</button>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn ghost" data-act="syncLeave">연결 끊고 이 기기 데이터로 돌아가기</button></div>` : `<div class="sy-form"><label class="field"><span class="label">수업 코드 (진행 기기 화면에 있어요)</span><input class="input num" id="syCode" inputmode="numeric" maxlength="4" placeholder="1234" value="${esc(SY.code || '')}"></label>
      <div class="field"><span class="label">맡을 경기장</span><div class="chips">${[1, 2, 3, 4, 5, 6, 7, 8].map(n => `<button class="chip" data-act="syncCourtPick" data-v="${n}" aria-pressed="${(ui.syCourt || SY.court) === n}">${n}번</button>`).join('')}</div></div>
      <button class="btn go lg" data-act="syncJoin" ${avail ? '' : 'disabled'}>연결하기</button></div><p class="muted tiny" style="margin:8px 0 0">경기장 기기로 연결해도 이 기기에 저장된 원래 기록은 지워지지 않아요. 연결을 끊으면 돌아와요.</p>`}</div>` : ''}
    ${pick === 'local' && m !== 'local' ? `<div class="sy-box"><p class="muted small" style="margin:0 0 8px">연결을 끊고 이 기기에만 저장하는 방식으로 돌아가요.</p><button class="btn" data-act="syncLeave">연결 끊기</button></div>` : ''}
    <p class="muted tiny">${SY.db && SY.db.kind === 'supabase' ? '로그인 없이 수업 코드만 같으면 연결돼요 (Supabase 공유 저장소). 진행 기기는 교사 비밀번호가 필요해요. 인터넷(체육관 와이파이)이 필요해요.' : '같은 claude.ai 계정(또는 이 앱을 함께 쓰도록 공유받은 계정)으로 로그인한 기기끼리 연결돼요. 체육관 와이파이가 필요해요.'}</p>
  </div>`;
}
const newCode = () => String(Math.floor(1000 + Math.random() * 9000));
// 경기장 기기 화면: 맡은 경기장의 지금 경기
function viewCourt() {
  const c = S.comp; const N = SY.court;
  if (SY.waiting) return `<section class="panel"><div class="empty"><h3>진행 기기와 연결하는 중…</h3></div></section>`;
  if (!c) return `<section class="panel"><div class="empty"><h3>경기장 ${N}번 · 대진표를 기다리는 중</h3><p class="muted">진행 기기에서 대진표를 만들면 여기에 경기가 나타나요. 수업 코드 <b class="num">${SY.code}</b></p></div></section>`;
  const live = c.matches.find(m => m.court === N && !m.done) || c.matches.find(m => m.court === N && evalHold(c, m));
  freshCheck(live && !live.done ? [live] : []);
  const myDone = c.matches.filter(m => m.done && !m.bye && SY.mdocs[m.id] && SY.mdocs[m.id].by === `c${N}`).length;
  // 이 경기장에서 끝냈지만 태도 평가를 못 한 경기 → 여기서 이어서 평가
  const mine = m => m.court === N || (SY.mdocs[m.id] && SY.mdocs[m.id].by === `c${N}`);
  const evLeft = attOn(c) ? c.matches.filter(m => m.done && !m.bye && mine(m) && !(c.evals[m.id] && c.evals[m.id].done) && m !== live) : [];
  return `<div class="stack">
    ${nextAskHTML(c)}
    ${evLeft.length ? `<section class="panel ev-left"><div class="sec-t" style="font-size:16px">못 한 태도 평가 <span class="pill warn">${evLeft.length}개</span></div><div class="mlist">${evLeft.map(m => `<button class="mrow" data-act="evalOpen" data-m="${m.id}"><span class="no">${esc(stageLabel(c, m).replace('라운드', 'R'))}</span><span class="t r">${esc(entName(c, m.a, { short: true }))}</span><span class="sc num">${esc(scoreText(c, m))}</span><span class="t">${esc(entName(c, m.b, { short: true }))}</span><span class="st"><span class="pill warn">평가하기</span></span></button>`).join('')}</div></section>` : ''}
    <div class="comp-head"><div><h2>경기장 ${N}번</h2><div class="meta">${esc(compTitle(c))} · ${esc(gameText(rulesOf(c)))} · 이 경기장에서 끝낸 경기 ${myDone}개</div></div></div>
    ${live ? `<div class="courts court-one">${courtCard(c, live)}</div><p class="muted small">[▶ 경기 시작]을 누르면 점수판이 열려요. 경기를 끝내면 결과가 진행 기기로 가고, 다음 경기가 자동으로 이 화면에 올라와요.</p>`
      : `<section class="panel"><div class="empty"><h3>${compFinished(c) ? '모든 경기가 끝났어요' : '다음 경기를 기다리는 중'}</h3><p class="muted">${compFinished(c) ? '진행 기기에서 기록을 확인하세요.' : '진행 기기가 이 경기장에 경기를 배정하면 바로 나타나요.'}</p></div></section>`}
  </div>`;
}

/* 시작 */
if (STORAGE_OK && lsGet(KEY_CUR)) ui.savedAt = S.updatedAt;
// 진행 중인 경기: 비어 있는 심판('자율') 등을 지금 상황에 맞게 다시 배정
try { if (S.comp && !S.comp.finishedAt && SY.mode !== 'court' && S.comp.matches.some(m => m.court && !m.done && m.referee === '자율' && !m.refManual)) { assignCourts(S.comp); save(); } } catch (e) { }
render();
setTimeout(async () => { getDL(); const db = await getDB(); if (!db && SY.mode !== 'local') { SY.mode = 'local'; SY.code = ''; syncSaveMode(); render(); } else if (SY.mode !== 'local') syncConnect(); }, 0);
if (firstRun) save();

</script>
</body></html>
